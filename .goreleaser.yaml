version: 2
project_name: vulnscan

builds:
  - id: vscan
    main: ./cmd/vscan
    binary: vscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{.Tag}}

nfpms:
  - id: vulnscan
    package_name: vulnscan
    formats:
      - deb
    maintainer: "TeraP-dev"
    homepage: https://github.com/TeraP-dev/vulnscan
    description: Check installed packages against the OSV vulnerability database.
    license: MIT
    bindir: /usr/bin

archives:
  - name_template: "vscan_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  sort: asc